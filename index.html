<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Метал Мастер — Металлообработка и ЧПУ во Владивостоке</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0F17;
            --bg-card: #131A26;
            --accent: #00E5FF;
            --accent-hover: #00B2CC;
            --text-main: #FFFFFF;
            --text-muted: #8F9CAE;
            --border: #222E43;
            --grid-color: rgba(0, 229, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        header {
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 23, 0.8);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .header-contacts {
            display: flex;
            gap: 24px;
            font-size: 14px;
        }

        .header-contacts a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .header-contacts a:hover {
            color: var(--accent);
        }

        .hero {
            padding: 180px 20px 100px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 225, 255, 0.08);
            border: 1px solid rgba(0, 225, 255, 0.2);
            padding: 6px 16px;
            border-radius: 4px;
            color: var(--accent);
            font-size: 13px;
            width: fit-content;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 24px;
            max-width: 900px;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-dark);
            padding: 18px 36px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 229, 255, 0.4);
        }

        section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 48px;
            position: relative;
            padding-left: 20px;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 4px;
            background: var(--accent);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 4px;
            position: relative;
            transition: border-color 0.3s;
        }

        .service-card:hover {
            border-color: var(--accent);
        }

        .service-num {
            position: absolute;
            top: 40px;
            right: 40px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 32px;
            font-weight: 700;
        }

        .service-card h3 {
            font-size: 20px;
            margin-bottom: 16px;
            padding-right: 40px;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .steps-flow {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 4px;
        }

        .step-item {
            position: relative;
        }

        .step-num {
            color: var(--accent);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .step-name {
            font-size: 15px;
            font-weight: 500;
        }

        .form-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 60px;
            max-width: 800px;
            margin: 0 auto 100px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            h1 { font-size: 38px; }
            .header-contacts { display: none; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 768px) {
            .form-group.full-width { grid-column: span 1; }
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input, textarea {
            background: rgba(11, 15, 23, 0.6);
            border: 1px solid var(--border);
            padding: 14px;
            color: #fff;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            padding: 32px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            background: rgba(11, 15, 23, 0.3);
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(0, 229, 255, 0.02);
        }

        .file-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-dark);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .file-remove {
            color: #FF5252;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-label {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 24px;
        }

        .checkbox-label input {
            margin-top: 3px;
        }

        .form-actions {
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

        <div class="header-container">

        </div>
    </header>

    <main>
